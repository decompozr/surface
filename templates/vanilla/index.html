<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Surface workspace</title>
<style>body{font-family:system-ui,sans-serif;background:#f7f6f0;color:#213b31;margin:0}main{max-width:640px;margin:10vh auto;padding:24px}label{display:block;margin-bottom:8px}textarea{box-sizing:border-box;width:100%;min-height:120px;padding:12px;font:inherit}button{padding:12px 20px;margin-top:16px;background:#213b31;color:white;border:0;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><main><h1>A page for your next idea.</h1><form><label for="message">Your message</label><textarea id="message" name="message" required maxlength="1000"></textarea><button>Send to agent</button></form><p role="status">Ready for your input.</p><pre aria-label="Agent result"></pre></main><script type="module" src="/src/main.ts"></script></body></html>
